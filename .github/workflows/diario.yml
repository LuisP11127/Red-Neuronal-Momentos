name: Diario

# Cada día a las 19:30 hora Lima (00:30 UTC): media hora después del cierre de la vela diaria de Binance
# (00:00 UTC) y cuando el escaneo automático de Scanner-pump (00:07 UTC) ya guardó su día.
#   1. Copia las listas de seguimiento de Momento-A, Momento-B y Scanner-pump a datos/listas/.
#   2. La red puntúa las monedas del día y guarda su lista en predicciones/AAAA-MM-DD.json.
#   3. Mide cada lista desde la hora en que se calculó en predicciones/resultados.csv.
#   4. Calcula las etiquetas (¿llegó a +50 % en los 10 días siguientes?) en datos/etiquetas.csv.
#   5. Calcula las señales de cada moneda a las 19:30 en datos/senales.csv.
#   6. Guarda los cambios en el repositorio.
# GitHub solo ejecuta los workflows programados desde la rama principal y suele lanzarlo con retraso (se han visto
# más de cuatro horas): la lista sale igual, con la hora en que se calculó, y su resultado se mide desde esa hora.
# También se lanza a mano: Actions → Diario → Run workflow.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos  # el mismo que Entrenar y Reconstrucción: no guardan a la vez
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # Los tres repositorios son públicos: se descarga solo su carpeta de seguimiento.
      - uses: actions/checkout@v4
        with:
          repository: LuisP11127/Momento-A
          path: fuentes/momento-a
          sparse-checkout: docs/seguimiento
      - uses: actions/checkout@v4
        with:
          repository: LuisP11127/Momento-B
          path: fuentes/momento-b
          sparse-checkout: docs/seguimiento
      - uses: actions/checkout@v4
        with:
          repository: LuisP11127/Scanner-pump
          path: fuentes/scanner-pump
          sparse-checkout: datos/seguimiento

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      # Si una fuente falla, las demás se copian igual y el aviso queda al final.
      - name: Copiar las listas
        id: listas
        continue-on-error: true
        shell: bash
        run: |
          { echo "## Listas"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          set +e
          python -m red_momentos.listas --momento-a fuentes/momento-a --momento-b fuentes/momento-b \
            --scanner-pump fuentes/scanner-pump 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          codigo=${PIPESTATUS[0]}
          { echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo

      # Justo después de copiar las listas, para que el libro y las métricas sean lo más cercanos posible a las
      # 19:30. Si la red aún no está entrenada (no hay modelo/red.json), no hace nada.
      - name: Predecir
        id: prediccion
        if: always()
        continue-on-error: true
        shell: bash
        run: python -m red_momentos.prediccion | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Medir las listas de la red
        id: aciertos
        if: always()
        continue-on-error: true
        shell: bash
        run: python -m red_momentos.aciertos | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Calcular las etiquetas
        id: etiquetas
        if: always()
        continue-on-error: true
        run: python -m red_momentos.etiquetas --resumen "$GITHUB_STEP_SUMMARY"

      - name: Calcular las señales
        id: senales
        if: always()
        continue-on-error: true
        run: python -m red_momentos.senales

      - name: Guardar en el repositorio
        if: always()
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos predicciones 2>/dev/null || git add -A datos
          if git diff --cached --quiet; then
            echo "Los datos ya estaban al día."
            exit 0
          fi
          partes=()
          for fuente in momento-a momento-b scanner-pump; do
            dias=$(git diff --cached --name-only -- "datos/listas/$fuente" | xargs -r -n1 basename | sed 's/\.json$//' | paste -sd ' ' -)
            if [ -n "$dias" ]; then partes+=("$fuente $dias"); fi
          done
          if ! git diff --cached --quiet -- datos/etiquetas.csv; then partes+=("etiquetas"); fi
          if ! git diff --cached --quiet -- datos/senales.csv; then partes+=("señales"); fi
          if [ -n "$(git diff --cached --name-only -- 'predicciones/*.json')" ]; then partes+=("predicción"); fi
          if ! git diff --cached --quiet -- predicciones/resultados.csv; then partes+=("resultados de la red"); fi
          mensaje="Datos: $(printf '%s; ' "${partes[@]}" | sed 's/; $//') (automático)"
          git commit --quiet -m "$mensaje"
          # Solo este workflow escribe en datos/, así que basta con ponerse encima de lo que haya llegado.
          for intento in 1 2 3 4 5; do
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "Guardado: $mensaje"
              exit 0
            fi
            sleep $((intento * 5))
            git pull --quiet --rebase origin "$BRANCH"
          done
          echo "::error title=Datos sin guardar::No se pudieron subir los datos tras varios intentos."
          exit 1

      - name: Avisar si algo falló
        if: steps.listas.outcome == 'failure' || steps.etiquetas.outcome == 'failure' || steps.senales.outcome == 'failure' || steps.prediccion.outcome == 'failure' || steps.aciertos.outcome == 'failure'
        run: |
          echo "::error title=Actualización incompleta::Falló la copia de alguna lista, la predicción, sus resultados, las etiquetas o las señales; revisa los pasos de arriba."
          exit 1
