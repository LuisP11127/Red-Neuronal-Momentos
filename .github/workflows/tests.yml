name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["datos/**"]  # los guardados del workflow Diario no cambian el código
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
