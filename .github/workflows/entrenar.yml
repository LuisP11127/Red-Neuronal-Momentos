name: Entrenar

# Entrena la red con la reconstrucción y las listas reales y guarda modelo/red.json y modelo/INFORME.md.
# Cada lunes a las 01:07 UTC (después del Diario de las 00:30) y a mano: Actions → Entrenar → Run workflow.
on:
  schedule:
    - cron: "7 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Entrenar la red
        run: |
          python -m red_momentos.red
          cat modelo/INFORME.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el modelo
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modelo
          if git diff --cached --quiet; then
            echo "El modelo no cambió."
            exit 0
          fi
          git commit --quiet -m "Modelo: red entrenada (automático)"
          for intento in 1 2 3 4 5; do
            if git push --quiet origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((intento * 5))
            git pull --quiet --rebase origin "$BRANCH"
          done
          echo "::error title=Modelo sin guardar::No se pudo subir el modelo tras varios intentos."
          exit 1
