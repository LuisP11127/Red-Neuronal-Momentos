name: Web

# Publica la web de la red en GitHub Pages: la lista del día, el seguimiento de sus predicciones y tus
# estrellas (python -m red_momentos.web sitio). Los precios en vivo los pide la página desde el navegador.
# Solo despliega si GitHub Pages está activado con «Source: GitHub Actions».
on:
  push:
    branches: [main]
  workflow_run:  # los guardados de estos workflows no lanzan «push» (los hace GitHub Actions)
    workflows: ["Diario", "Entrenar", "Reconstrucción"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          echo "GitHub Pages: ${build_type:-desactivado}"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Web sin publicar::Activa GitHub Pages con «Source: GitHub Actions» (ver README)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # tras un workflow_run, lo último que guardó
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m red_momentos.web sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
